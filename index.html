<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d8cfbd">
<title>Lodestone</title>
<meta name="description" content="Iron filings on a sheet of paper. Your fingers are magnets beneath it. Tap the paper and the filings find the field.">
<meta property="og:title" content="Lodestone">
<meta property="og:description" content="Iron filings on paper, for your phone. Fingers are magnets. Tap the paper.">
<meta property="og:image" content="https://aemtti.github.io/lodestone/preview.png">
<meta property="og:url" content="https://aemtti.github.io/lodestone/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d8cfbd;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif","Noto Serif KR","Nanum Myeongjo",Georgia,serif;color:#2a2521}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
.halo{text-shadow:0 0 5px #ece4d4,0 0 11px #ece4d4,0 0 20px #ece4d4}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:opacity 1.8s ease}
#intro.gone{opacity:0;pointer-events:none}
.patch{padding:18px 56px;border-radius:50px;background:radial-gradient(closest-side,rgba(233,225,208,.97) 72%,rgba(233,225,208,0))}
#intro .t{font-size:12px;letter-spacing:.55em;text-indent:.55em;opacity:.8}
#intro .s{margin-top:14px;font-size:17px;font-style:italic;opacity:.62}
#intro .p{margin-top:24vh;font-size:17px;animation:breathe 3.2s ease-in-out infinite}
body.ko #intro .s,body.ko #hint{font-style:normal}
@keyframes breathe{0%,100%{opacity:.34}50%{opacity:.82}}
#hint{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));padding:0 30px;text-align:center;font-size:15px;line-height:1.55;font-style:italic;opacity:0;transition:opacity 1.3s ease;pointer-events:none}
#hint.on{opacity:.9}
#hint .patch{display:inline-block;padding:16px 40px;border-radius:40px}
#ui{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:10px;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#ui.on{opacity:1;pointer-events:auto}
#ui button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(60,44,26,.28);background:rgba(236,228,212,.84);box-shadow:0 1px 4px rgba(60,44,26,.18);padding:0;display:flex;align-items:center;justify-content:center;color:#2a2521;cursor:pointer;touch-action:manipulation}
#ui button:active{transform:scale(.93)}
#ui button.hide{display:none}
#toast{position:absolute;top:calc(68px + env(safe-area-inset-top,0px));right:14px;font-size:14px;opacity:0;transition:opacity .5s ease;pointer-events:none}
#toast.on{opacity:.92}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro" class="halo" role="button" aria-label="tap the paper to begin">
  <div class="patch"><div class="t">LODESTONE</div><div class="s" id="sub">iron filings on paper</div></div>
  <div class="p patch" id="tap">tap the paper</div>
</div>
<div id="hint" class="halo" aria-live="polite"><span class="patch" id="hintTxt"></span></div>
<div id="ui">
  <button id="btnSprinkle" aria-label="sprinkle fresh filings"><svg width="26" height="26" viewBox="0 0 26 26" fill="currentColor"><circle cx="8" cy="9" r="1.7"/><circle cx="15" cy="7" r="1.7"/><circle cx="12" cy="14" r="1.7"/><circle cx="19" cy="15" r="1.7"/><circle cx="7" cy="18" r="1.7"/><circle cx="14" cy="21" r="1.7"/></svg></button>
  <button id="btnLevel" aria-label="set level"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="15" r="4.6" fill="none" stroke="currentColor" stroke-width=".8" opacity=".55"/><circle id="bubble" cx="15" cy="15" r="3.4" fill="currentColor"/></svg></button>
</div>
<div id="toast" class="halo" aria-live="polite"></div>
<noscript><p style="position:absolute;top:40%;width:100%;text-align:center">Lodestone needs JavaScript.</p></noscript>
<script>
(() => {
'use strict';
const KO = /^ko\b/i.test(navigator.language || '');
const TX = KO ? {
  sub: '종이 위의 쇳가루', tap: '종이를 톡 두드려 보세요',
  h1: '종이에 손가락을 대고 있어 보세요. 그 아래에 자석이 있어요.',
  h2: '그대로 둔 채, 다른 손가락으로 근처를 톡톡 두드려 보세요.',
  h3: '두 손가락이면, 두 개의 극.',
  h4: '기울이면 쏟아지고, 빙글 돌리면 소용돌이쳐요. 폰을 톡 치면 들썩여요.',
  h5: '자석 없이 두드리면, 쇳가루는 진짜 북쪽을 향해 누워요.',
  d1: '종이를 꾹 누르고 있어 보세요. 그 아래에 자석이 있어요.',
  d2: '우클릭으로 자석을 놓아두고, 그 둘레를 톡톡 클릭해 보세요.',
  d3: '두 개를 놓으면, 두 개의 극.',
  d4: '마우스로 빛을 비추고 · 방향키로 기울이고 · 스크롤로 돌리고 · 스페이스로 두드려요.',
  hL: '오른쪽 위 ◎ 버튼을 누르면, 지금 들고 있는 자세가 수평이 돼요.',
  hS: '쇳가루가 한쪽에 몰리면, ∴ 버튼으로 새로 뿌려요.',
  lv: '지금 자세를 수평으로 맞췄어요', sp: '새로 뿌렸어요'
} : {
  sub: 'iron filings on paper', tap: 'tap the paper',
  h1: 'Rest a finger on the paper. A magnet waits beneath it.',
  h2: 'Keep it there, and tap nearby with another finger.',
  h3: 'Two fingers, two poles.',
  h4: 'Tilt to pour. Twist to swirl. Knock the phone to shake them loose.',
  h5: 'Tapped with no magnet near, they lie down toward the real north.',
  d1: 'Press and hold on the paper. A magnet waits beneath it.',
  d2: 'Right-click to leave a magnet, then click around it.',
  d3: 'Leave two, and they become two poles.',
  d4: 'Move the mouse to catch the light · arrow keys tilt · scroll twists · space knocks.',
  hL: 'The ◎ button (top right) makes the way you hold the phone right now level.',
  hS: 'If the filings all end up in one place, ∴ sprinkles fresh ones.',
  lv: 'Level set to how you hold it now', sp: 'Fresh filings'
};
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d', { alpha: false }), introEl = $('intro'), hintEl = $('hint'), hintTxt = $('hintTxt');
if (KO) { document.body.classList.add('ko'); document.documentElement.lang = 'ko'; }
$('sub').textContent = TX.sub; $('tap').textContent = TX.tap;

const PI = Math.PI, TAU = PI * 2, D2R = PI / 180, rnd = Math.random;
const randn = () => (rnd() + rnd() + rnd() - 1.5) * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (x, a, b) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const now = () => performance.now();
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const DEMO = /demo/.test(location.hash);
const COARSE = matchMedia('(pointer: coarse)').matches;

// ---- physical feel ----
const Q0 = 1.1e5, DEP = 26, DEP2 = DEP * DEP;          // magnet strength, depth below the paper (px)
const EARTH = 1.0, INCL = 53 * D2R;                     // Earth's field, inclination (Korea ~53°)
const B0SQ = 2.5, BS2 = 64;                             // alignment softness, field that beats friction
const RA = 30, RP = 14;                                 // alignment rates (in air / on paper)
const KM = 0.8, MAXM = 160;                             // magnetic pull (reaches only a few cm)
const GS = 420, MUS = 0.3, MUK = 0.2, GA = 2600;        // 1 g in px/s, static / kinetic friction, hop gravity
const DGS = 7, KP = 900;                                // crowding: grains take up room, so piles have thickness
const HOLD = 130, MAXMAG = 6;

let W = 0, H = 0, N = 0, ls = 1;
let px, py, th, ln, pz, vz, vx, vy, sd, el;
let agit = 0, dirty = true;
const magnets = [];

function alloc(n) {
  N = n;
  px = new Float32Array(n); py = new Float32Array(n); th = new Float32Array(n); ln = new Float32Array(n);
  pz = new Float32Array(n); vz = new Float32Array(n); vx = new Float32Array(n); vy = new Float32Array(n); sd = new Float32Array(n); el = new Float32Array(n);
}
function sprinkle() {
  const a1 = rnd() * TAU, a2 = rnd() * TAU, a3 = rnd() * TAU, f1 = 0.006 + rnd() * 0.006, f2 = 0.008 + rnd() * 0.008;
  for (let i = 0; i < N; i++) {
    let x = 0, y = 0;
    for (let k = 0; k < 8; k++) {
      x = rnd() * W; y = rnd() * H;
      const d = 0.62 + 0.26 * Math.sin(x * f1 + a1) * Math.sin(y * f2 + a2) + 0.14 * Math.sin((x - y) * 0.013 + a3);
      if (rnd() < d) break;
    }
    px[i] = clamp(x, 2, W - 2); py[i] = clamp(y, 2, H - 2);
    th[i] = rnd() * PI; ln[i] = (2.6 + 5.0 * Math.pow(rnd(), 1.6)) * ls; sd[i] = rnd();
    pz[i] = vz[i] = vx[i] = vy[i] = el[i] = 0;
  }
  dirty = true;
}

// ---- paper ----
let paper = null;
function makePaper() {
  const s = Math.min(DPR, 1.5), w = Math.max(2, Math.round(W * s)), h = Math.max(2, Math.round(H * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#e8e0cf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 36; i++) {
    const x = rnd() * w, y = rnd() * h, r = (40 + rnd() * 170) * s, gr = g.createRadialGradient(x, y, 0, x, y, r), dk = rnd() < 0.5;
    gr.addColorStop(0, dk ? 'rgba(120,98,66,0.04)' : 'rgba(255,252,242,0.06)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.lineCap = 'round';
  const nf = (w * h) / 900;
  for (let i = 0; i < nf; i++) {
    const x = rnd() * w, y = rnd() * h, a = rnd() * TAU, l = (6 + rnd() * 22) * s;
    g.strokeStyle = rnd() < 0.5 ? 'rgba(110,88,58,0.07)' : 'rgba(255,255,250,0.12)';
    g.lineWidth = (0.4 + rnd() * 0.7) * s;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.5) * l * 0.5, y + Math.sin(a + 0.5) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.9; }
  g.putImageData(id, 0, 0);
  // the tray lip: a soft inner shadow at the edges
  const e = 18 * s;
  const sides = [[0, 0, w, e, 0, 0, 0, e], [0, h - e, w, e, 0, h, 0, h - e], [0, 0, e, h, 0, 0, e, 0], [w - e, 0, e, h, w, 0, w - e, 0]];
  for (const q of sides) { const gr = g.createLinearGradient(q[4], q[5], q[6], q[7]); gr.addColorStop(0, 'rgba(60,44,26,0.30)'); gr.addColorStop(1, 'rgba(60,44,26,0)'); g.fillStyle = gr; g.fillRect(q[0], q[1], q[2], q[3]); }
  paper = c; dirty = true;
}

let dgW = 0, dgH = 0, dens = null, exc = null, rho0 = 1;
function setupGrid() {
  dgW = Math.floor(W / DGS) + 3; dgH = Math.floor(H / DGS) + 3;
  dens = new Float32Array(dgW * dgH); exc = new Float32Array(dgW * dgH);
  rho0 = Math.max(1, N / ((W * H) / (DGS * DGS)) * 2.4);
}
function resize() {
  const nw = Math.round(window.innerWidth), nh = Math.round(window.innerHeight);
  if (nw < 60 || nh < 60 || (nw === W && nh === H)) return;
  const ow = W, oh = H; W = nw; H = nh;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  if (!N || ow < 60 || oh < 60) {
    const n = clamp(Math.round(W * H / 40), 2500, 9000);
    ls = clamp(Math.sqrt((W * H / n) / 40), 1, 1.8);
    alloc(n); sprinkle();
  } else {
    const sx = W / ow, sy = H / oh;
    for (let i = 0; i < N; i++) { px[i] = clamp(px[i] * sx, 1.5, W - 1.5); py[i] = clamp(py[i] * sy, 1.5, H - 1.5); }
    for (const m of magnets) { m.x *= sx; m.y *= sy; }
  }
  setupGrid();
  makePaper();
}
addEventListener('resize', resize);

// ---- light and the real world ----
function lightModel() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h >= 6.5 && h <= 18.5) {
    const t = (h - 6) / 12, az = (90 + 180 * t) * D2R, e = (24 + 36 * Math.sin(PI * t)) * D2R;
    return { v: [Math.cos(e) * Math.sin(az), Math.cos(e) * Math.cos(az), Math.sin(e)], night: false };
  }
  const az = 160 * D2R, e = 62 * D2R;
  return { v: [Math.cos(e) * Math.sin(az), Math.cos(e) * Math.cos(az), Math.sin(e)], night: true };
}
let lightW = lightModel();
setInterval(() => { lightW = lightModel(); }, 300000);
const earthW = [0, EARTH * Math.cos(INCL), -EARTH * Math.sin(INCL)];

// world (east, north, up) -> device frame, W3C Z-X'-Y'' angles
function w2d(v, a, b, g) {
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
  const x1 = ca * v[0] + sa * v[1], y1 = -sa * v[0] + ca * v[1], z1 = v[2];
  const y2 = cb * y1 + sb * z1, z2 = -sb * y1 + cb * z1;
  return [cg * x1 - sg * z2, y2, sg * x1 + cg * z2];
}
const sens = { ori: false, abs: false, t: 0, motion: false, mt: 0, peak: 0, floor: 0.3, gyro: false, rz: 0, rt: 0, hx: 0, hy: 0, hz: 0, ax: 0, ay: 0, lastKnock: 0, init: false };
const raw = { g: [0, 0, -1], L: [0, 0, 1], E: [0, 0.6, -0.8] }, sm = { g: [0, 0, -1], L: [0, 0, 1], E: [0, 0.6, -0.8] };
// "level": the pose the person chose as flat (set at the first tap and by the ◎ button; it never drifts on its own)
const ref = [0, 0, -1];
let needLevel = false;
// tilt of g relative to ref: rotate g by the rotation that carries ref onto straight-down
function relTilt(g, r) {
  let kx = -r[1], ky = r[0];
  const s = Math.hypot(kx, ky), c = -r[2];
  if (s < 1e-6) return c > 0 ? [g[0], g[1]] : [-g[0], -g[1]];
  kx /= s; ky /= s;
  const kv = kx * g[0] + ky * g[1];
  return [g[0] * c + ky * g[2] * s + kx * kv * (1 - c), g[1] * c - kx * g[2] * s + ky * kv * (1 - c)];
}
function fromAngles(a, b, g) { raw.g = w2d([0, 0, -1], a, b, g); raw.L = w2d(lightW.v, a, b, g); raw.E = w2d(earthW, a, b, g); }
function onOrient(e, isAbs) {
  if (e.beta == null || e.gamma == null) return;
  let a = e.alpha;
  const ch = e.webkitCompassHeading;
  if (typeof ch === 'number' && isFinite(ch)) { a = 360 - ch; isAbs = true; }
  if (isAbs && a != null) sens.abs = true; else if (sens.abs) return;
  sens.ori = true; sens.t = now();
  fromAngles((a || 0) * D2R, e.beta * D2R, e.gamma * D2R);
}
addEventListener('deviceorientationabsolute', e => onOrient(e, true));
addEventListener('deviceorientation', e => onOrient(e, !!e.absolute));
addEventListener('devicemotion', e => {
  let m = -1, lx = 0, ly = 0;
  const a = e.acceleration;
  if (a && a.x != null) { lx = a.x; ly = a.y; m = Math.hypot(a.x, a.y, a.z || 0); }
  else {
    const g = e.accelerationIncludingGravity;
    if (g && g.x != null) {
      sens.hx += (g.x - sens.hx) * 0.1; sens.hy += (g.y - sens.hy) * 0.1; sens.hz += ((g.z || 0) - sens.hz) * 0.1;
      lx = g.x - sens.hx; ly = g.y - sens.hy; m = Math.hypot(lx, ly, (g.z || 0) - sens.hz);
    }
  }
  if (m >= 0) {
    sens.motion = true; sens.mt = now();
    // the paper's own acceleration (device frame): the grains lag behind it, like sand in a shaken tray
    sens.ax += (lx - sens.ax) * 0.5; sens.ay += (ly - sens.ay) * 0.5;
    if (m > sens.peak) sens.peak = m;
    if (m < sens.floor * 3 + 0.5) sens.floor += (m - sens.floor) * 0.01;
  }
  const r = e.rotationRate;
  if (r && r.alpha != null) { sens.gyro = true; sens.rz = r.alpha; sens.rt = now(); }
});

const virt = { beta: 0, gamma: 0, alpha: 0, omega: 0, mb: 0, mg: 0 };
const keys = new Set();
let omega = 0, face = 1;
const effG = [0, 0], tiltS = [0, 0], lightP = [0, 0, 1], earthP = [0, -0.6];
function scrAngle() { return (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0); }
function devToScr(x, y) { const a = scrAngle() * D2R, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, -(x * s + y * c)]; }
function mix3(o, t, k) { o[0] += (t[0] - o[0]) * k; o[1] += (t[1] - o[1]) * k; o[2] += (t[2] - o[2]) * k; }
function norm3(o) { const l = Math.hypot(o[0], o[1], o[2]) || 1; o[0] /= l; o[1] /= l; o[2] /= l; }
function updateOrientation(dt, t) {
  const live = sens.ori && t - sens.t < 1500;
  if (!live) {
    const kb = 1 - Math.exp(-dt / 0.25);
    let tb = 0, tg = 0;
    if (keys.has('ArrowUp') || keys.has('w')) tb -= 24;
    if (keys.has('ArrowDown') || keys.has('s')) tb += 24;
    if (keys.has('ArrowLeft') || keys.has('a')) tg -= 24;
    if (keys.has('ArrowRight') || keys.has('d')) tg += 24;
    if (!started) { tg += 5 * Math.sin(t / 2300); tb += 4 * Math.sin(t / 3100); }
    virt.beta += (tb - virt.beta) * kb; virt.gamma += (tg - virt.gamma) * kb;
    virt.omega *= Math.exp(-dt * 2.5); virt.alpha += virt.omega * dt;
    const va = virt.alpha, vb = virt.beta * D2R, vg = virt.gamma * D2R;
    raw.g = w2d([0, 0, -1], va, vb, vg);
    raw.L = w2d(lightW.v, va, vb + virt.mb * D2R, vg + virt.mg * D2R);
    raw.E = w2d(earthW, va, vb, vg);
    omega = virt.omega;
  } else {
    const target = (sens.gyro && t - sens.rt < 500) ? sens.rz * D2R : 0;
    omega += (target - omega) * (1 - Math.exp(-dt / 0.05));
  }
  if (live && !sens.init) { sens.init = true; for (let i = 0; i < 3; i++) { sm.g[i] = raw.g[i]; ref[i] = raw.g[i]; sm.L[i] = raw.L[i]; sm.E[i] = raw.E[i]; } }
  const k = 1 - Math.exp(-dt / 0.07);
  mix3(sm.g, raw.g, k); norm3(sm.g); mix3(sm.L, raw.L, k); norm3(sm.L); mix3(sm.E, raw.E, k);
  if (!live) { ref[0] = 0; ref[1] = 0; ref[2] = -1; }
  else if (needLevel) { needLevel = false; ref[0] = sm.g[0]; ref[1] = sm.g[1]; ref[2] = sm.g[2]; }
  const rt = relTilt(sm.g, ref), s = devToScr(rt[0], rt[1]);
  tiltS[0] = s[0]; tiltS[1] = s[1];
  // inertia: when the phone is shoved, the grains feel a push the other way (in g)
  const fresh = sens.motion && t - sens.mt < 300;
  const ia = fresh ? devToScr(-clamp(sens.ax, -25, 25) / 9.81, -clamp(sens.ay, -25, 25) / 9.81) : [0, 0];
  effG[0] = s[0] + ia[0]; effG[1] = s[1] + ia[1];
  const l = devToScr(sm.L[0], sm.L[1]);
  face = sstep(sm.L[2], -0.05, 0.35);
  const lz = Math.max(sm.L[2], 0.12), ll = Math.hypot(l[0], l[1], lz);
  const nl0 = l[0] / ll, nl1 = l[1] / ll, nl2 = lz / ll;
  if (Math.abs(nl0 - lightP[0]) + Math.abs(nl1 - lightP[1]) > 0.004) dirty = true;
  lightP[0] = nl0; lightP[1] = nl1; lightP[2] = nl2;
  const e = devToScr(sm.E[0], sm.E[1]); earthP[0] = e[0]; earthP[1] = e[1];

  for (let i = 0; i < N; i++) { pz[i] = 20 + rnd() * 170; vz[i] = -rnd() * 60; }
  for (const m of magnets) { if (m.pinned) { m.pinned = false; m.alive = false; } }
  agit = Math.max(agit, 0.3); stats.sprinkled = true; wake(3); toast(TX.sp);
  if (aok()) burst(AC.currentTime + 0.01, 0.45, 'bandpass', 5200, 0.7, 0.05);
}
function updateBubble() {
  // a spirit level: the bubble drifts to the high side of the paper
  const r = Math.hypot(tiltS[0], tiltS[1]), k = r > 0.6 ? 0.6 / r : 1;
  const nx = 15 - tiltS[0] * k * 12, ny = 15 - tiltS[1] * k * 12;
  if (Math.abs(nx - bubX) + Math.abs(ny - bubY) > 0.15) { bubX = nx; bubY = ny; bubble.setAttribute('cx', nx.toFixed(2)); bubble.setAttribute('cy', ny.toFixed(2)); }
}
btnLevel.addEventListener('click', e => { e.stopPropagation(); level(); btnLevel.blur(); });
btnSprinkle.addEventListener('click', e => { e.stopPropagation(); resprinkle(); btnSprinkle.blur(); });

// ---- start ----
let wakeLock = null;
async function requestWake() { try { if ('wakeLock' in navigator && !document.hidden) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {} }
function begin(x, y) {
  if (started || starting) return; starting = true;
  audioInit();
  if (AC && AC.state !== 'running') AC.resume().catch(() => {});
  if (COARSE && !/iPhone|iPad|iPod/.test(navigator.userAgent) && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen({ navigationUI: 'hide' }).then(() => { try { screen.orientation.lock('portrait').catch(() => {}); } catch (_) {} }).catch(() => {});
  }
  try { if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') DeviceMotionEvent.requestPermission().catch(() => {}); } catch (_) {}
  try { if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (_) {}
  started = true; startT = now(); needLevel = true;
  introEl.classList.add('gone'); setTimeout(() => introEl.remove(), 2200);
  uiEl.classList.add('on');
  tapKnock(x, y, 1.3); buzz(12); requestWake();
  setTimeout(() => { if (!sens.ori) { desktop = true; btnLevel.classList.add('hide'); } }, 1200);
}
introEl.addEventListener('click', e => begin(e.clientX, e.clientY));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (AC) AC.suspend().catch(() => {}); }
  else { if (AC && started) AC.resume().catch(() => {}); if (started) requestWake(); lastT = now(); dirty = true; }
});

// ---- loop ----
let lastT = now();
function frame() {
  const t = now();
  let dt = (t - lastT) / 1000; lastT = t;
  if (!(dt > 0)) dt = 0.016; if (dt > 0.034) dt = 0.034;
  updateOrientation(dt, t);
  updateMagnets(dt, t);
  agit *= Math.exp(-dt / 0.3); if (agit < 0.003) agit = 0;
  if (sens.motion) {
    const thrK = Math.max(2.8, sens.floor * 5 + 1);
    if (started && sens.peak > thrK && t - sens.lastKnock > 90 && t - lastTouchT > 170) { globalKnock(Math.min(1.4, 0.25 + (sens.peak - thrK) / 5)); sens.lastKnock = t; }
    sens.peak = 0;
    if (t - sens.mt > 300) { sens.ax *= 0.8; sens.ay *= 0.8; }
  }
  updateBubble();
  slideSum = 0;
  if (started) {
    if (magnets.length || Math.hypot(effG[0], effG[1]) > MUS * 0.85 || Math.abs(omega) > 0.3 || agit > 0.01) wake(0.2);
    if (wakeT > 0) { if (step(dt)) wake(0.2); wakeT -= dt; }
    hintsFrame(t);
  }
  if (aok()) {
    const at = AC.currentTime, lvl = Math.min(1, slideSum / (N * 10));
    hissG.gain.setTargetAtTime(0.3 * lvl, at, 0.07);
    hissF.frequency.setTargetAtTime(1800 + 3200 * lvl, at, 0.12);
    if (landings > 0) {
      const n = Math.min(5, Math.ceil(Math.sqrt(landings) / 3)), g = Math.min(1, landings / 80);
      for (let k = 0; k < n; k++) tick(at + 0.005 + rnd() * 0.02, 3000 + rnd() * 6500, (0.012 + rnd() * 0.045) * (0.35 + 0.65 * g));
    }
  }
  landings = 0;
  if (!paper) resize();
  if (dirty && paper) draw();
  requestAnimationFrame(frame);
}

resize();
if (DEMO) {
  introEl.remove(); started = true; startT = now(); desktop = true; hintList = [];
  addMagnet(W * 0.5, H * 0.37, true); addMagnet(W * 0.5, H * 0.63, true);
  let n = 0; const iv = setInterval(() => { globalKnock(0.6); if (++n >= 8) clearInterval(iv); }, 380);
}
window.lodestone = {
  knock: k => globalKnock(k || 1), tap: (x, y) => tapKnock(x, y, 1), pin: (x, y) => addMagnet(x, y, true),
  clear: () => { for (const m of magnets) { m.pinned = false; m.alive = false; } },
  sim: sec => { const d = 1 / 60; for (let k = 0; k < sec * 60; k++) { const t = now(); sens.t = t; sens.mt = t; updateOrientation(d, t); updateMagnets(d, t); agit *= Math.exp(-d / 0.3); step(d); } dirty = true; },
  level: () => level(), sprinkle: () => resprinkle(),
  get state() { return { N, W, H, started, desktop, magnets: magnets.map(m => [Math.round(m.q), m.alive, m.pinned]), nan: Array.prototype.some.call(px, v => v !== v), sensors: { ori: sens.ori, abs: sens.abs, motion: sens.motion, gyro: sens.gyro } }; }
};
requestAnimationFrame(frame);
})();
</script>
